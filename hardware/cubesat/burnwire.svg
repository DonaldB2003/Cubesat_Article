<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620"><style>text{font-family:Helvetica,Arial,sans-serif;fill:#0f172a}
.blk{fill:#fff;stroke:#64748b;stroke-width:1.5}.ttl{font-size:15px;font-weight:700}
.sub{font-size:11px;fill:#64748b;font-family:Menlo,Consolas,monospace}.pn{font-size:12px;font-family:Menlo,Consolas,monospace}
.net{font-size:12px;font-weight:700;font-family:Menlo,Consolas,monospace}.h1{font-size:22px;font-weight:700}
.note{font-size:12px;fill:#475569}.sym{fill:none;stroke:#334155;stroke-width:1.8}.wire{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="24" y="36" class="h1" text-anchor="start">CubeSat antenna-deploy burn-wire driver</text><text x="24" y="56" class="note" text-anchor="start">Redrawn from the original sketch. Nichrome heats when GPIO18 turns the MOSFET on.</text><rect class="blk" x="60" y="270" width="150" height="88" rx="7" style="fill:#fff"/><text x="72" y="294" class="ttl" text-anchor="start">Raspberry Pi</text><text x="72" y="311" class="sub" text-anchor="start">GPIO18</text><circle cx="210" cy="332" r="3" fill="#64748b"/><text x="201" y="336" class="pn" text-anchor="end">GPIO18</text><polyline class="wire" points="210,332 330,332" stroke="#334155"/><path class="sym" d="M330 332H360.0l5 -10 10 20 10 -20 10 20 10 -20 5 10H450"/><polyline class="wire" points="450,332 560,332" stroke="#334155"/><text x="390" y="316" class="pn" text-anchor="middle">R1 1 k</text><circle cx="500" cy="332" r="3.6" fill="#334155"/><polyline class="wire" points="500,332 500,360" stroke="#334155"/><path class="sym" d="M500 360V385.0l-10 5 20 10 -20 10 20 10 -20 10 10 5V470"/><polyline class="wire" points="500,470 500,500" stroke="#334155"/><path class="sym" d="M500 500V510M486 510H514M491 516H509M496 522H504"/><text x="515" y="420" class="pn" text-anchor="start">R2 10 k</text><text x="515" y="436" class="note" text-anchor="start">gate pull-down</text><circle cx="640" cy="332" r="70" fill="none" stroke="#94a3b8" stroke-width="1.4"/><polyline class="wire" points="560,332 610,332" stroke="#334155"/><polyline class="wire" points="610,300 610,364" stroke="#334155"/><polyline class="wire" points="622,296 622,312" stroke="#334155"/><polyline class="wire" points="622,324 622,340" stroke="#334155"/><polyline class="wire" points="622,352 622,368" stroke="#334155"/><polyline class="wire" points="622,304 680,304 680,250" stroke="#334155"/><polyline class="wire" points="622,360 680,360 680,420" stroke="#334155"/><polyline class="wire" points="622,332 660,332" stroke="#334155"/><polygon points="622,332 640,324 640,340" fill="#334155"/><text x="700" y="270" class="pn" text-anchor="start">Drain</text><text x="700" y="405" class="pn" text-anchor="start">Source</text><text x="560" y="322" class="pn" text-anchor="end">Gate</text><text x="720" y="470" class="note" text-anchor="start">IRFZ44N N-MOSFET (body diode is inside the package)</text><polyline class="wire" points="680,420 680,520" stroke="#334155"/><path class="sym" d="M680 520V530M666 530H694M671 536H689M676 542H684"/><polyline class="wire" points="500,500 680,500" stroke="#334155"/><polyline class="wire" points="680,250 680,190" stroke="#334155"/><path class="sym" d="M680 190V115.0l-10 5 20 10 -20 10 20 10 -20 10 10 5V100"/><polyline class="wire" points="680,100 680,70" stroke="#334155"/><text x="700" y="150" class="pn" text-anchor="start">Nichrome wire (burn wire)</text><line class="wire" x1="600" y1="70" x2="760" y2="70" stroke="#b91c1c"/><text x="770" y="74" class="net" text-anchor="start" fill="#b91c1c">VBAT +3.7 V</text><text x="60" y="560" class="note" text-anchor="start">Gate resistor limits GPIO current; the pull-down keeps the wire off while the Pi boots.</text><text x="60" y="580" class="note" text-anchor="start">Note: the IRFZ44N is a standard-gate MOSFET. At 3.3 V drive it may not turn fully on; an IRLZ44N (logic level) is a safer choice.</text></svg>