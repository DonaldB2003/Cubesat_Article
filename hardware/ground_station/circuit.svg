ext x="1309" y="356" class="pn" text-anchor="start">in 5V</text><line class="wire" x1="1300" y1="352" x2="1278" y2="352" stroke="#7c3aed"/><circle cx="1278" cy="352" r="3.4" fill="#7c3aed"/><text x="1271" y="356" class="net" text-anchor="end" fill="#7c3aed">TX(5V)</text><circle cx="1300" cy="374" r="3" fill="#64748b"/><text x="1309" y="378" class="pn" text-anchor="start">out 3V3</text><line class="wire" x1="1300" y1="374" x2="1278" y2="374" stroke="#7c3aed"/><circle cx="1278" cy="374" r="3.4" fill="#7c3aed"/><text x="1271" y="378" class="net" text-anchor="end" fill="#7c3aed">TX</text><rect class="blk" x="870" y="330" width="280" height="154" rx="7" style="fill:#fff"/><text x="882" y="354" class="ttl" text-anchor="start">Status + buzzer</text><text x="882" y="371" class="sub" text-anchor="start">330 ohm per LED</text><circle cx="870" cy="392" r="3" fill="#64748b"/><text x="879" y="396" class="pn" text-anchor="start">GREEN rx</text><line class="wire" x1="870" y1="392" x2="848" y2="392" stroke="#16a34a"/><circle cx="848" cy="392" r="3.4" fill="#16a34a"/><text x="841" y="396" class="net" text-anchor="end" fill="#16a34a">LED_G</text><circle cx="870" cy="414" r="3" fill="#64748b"/><text x="879" y="418" class="pn" text-anchor="start">RED err</text><line class="wire" x1="870" y1="414" x2="848" y2="414" stroke="#dc2626"/><circle cx="848" cy="414" r="3.4" fill="#dc2626"/><text x="841" y="418" class="net" text-anchor="end" fill="#dc2626">LED_R</text><circle cx="870" cy="436" r="3" fill="#64748b"/><text x="879" y="440" class="pn" text-anchor="start">buzzer +</text><line class="wire" x1="870" y1="436" x2="848" y2="436" stroke="#0f766e"/><circle cx="848" cy="436" r="3.4" fill="#0f766e"/><text x="841" y="440" class="net" text-anchor="end" fill="#0f766e">BUZ</text><circle cx="870" cy="458" r="3" fill="#64748b"/><text x="879" y="462" class="pn" text-anchor="start">GND</text><line class="wire" x1="870" y1="458" x2="848" y2="458" stroke="#475569"/><circle cx="848" cy="458" r="3.4" fill="#475569"/><text x="841" y="462" class="net" text-anchor="end" fill="#475569">GND</text><text x="40" y="470" class="note" text-anchor="start">Power: both boards from USB 5 V. Power RA-02 from the ESP32 3V3 pin, not the Nano (its 3V3 pin cannot supply TX current).</text><text x="40" y="492" class="note" text-anchor="start">Join all grounds. Antenna: SMA bulkhead on the enclosure to the mast helix.</text></svg>