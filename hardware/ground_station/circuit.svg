K(5V)</text><text x="432" y="270" class="note" text-anchor="start">Nano outputs are 5 V, RA-02 inputs are 3.3 V.</text><rect class="blk" x="870" y="100" width="280" height="198" rx="7" style="fill:#fffbeb"/><text x="882" y="124" class="ttl" text-anchor="start">Arduino Nano</text><text x="882" y="141" class="sub" text-anchor="start">signal handling / decoding (5 V)</text><circle cx="870" cy="162" r="3" fill="#64748b"/><text x="879" y="166" class="pn" text-anchor="start">D10</text><line class="wire" x1="870" y1="162" x2="848" y2="162" stroke="#2563eb"/><circle cx="848" cy="162" r="3.4" fill="#2563eb"/><text x="841" y="166" class="net" text-anchor="end" fill="#2563eb">NSS(5V)</text><circle cx="870" cy="184" r="3" fill="#64748b"/><text x="879" y="188" class="pn" text-anchor="start">D9</text><line class="wire" x1="870" y1="184" x2="848" y2="184" stroke="#2563eb"/><circle cx="848" cy="184" r="3.4" fill="#2563eb"/><text x="841" y="188" class="net" text-anchor="end" fill="#2563eb">RST(5V)</text><circle cx="870" cy="206" r="3" fill="#64748b"/><text x="879" y="210" class="pn" text-anchor="start">D11 MOSI</text><line class="wire" x1="870" y1="206" x2="848" y2="206" stroke="#2563eb"/><circle cx="848" cy="206" r="3.4" fill="#2563eb"/><text x="841" y="210" class="net" text-anchor="end" fill="#2563eb">MOSI(5V)</text><circle cx="870" cy="228" r="3" fill="#64748b"/><text x="879" y="232" class="pn" text-anchor="start">D13 SCK</text><line class="wire" x1="870" y1="228" x2="848" y2="228" stroke="#2563eb"/><circle cx="848" cy="228" r="3.4" fill="#2563eb"/><text x="841" y="232" class="net" text-anchor="end" fill="#2563eb">SCK(5V)</text><circle cx="870" cy="250" r="3" fill="#64748b"/><text x="879" y="254" class="pn" text-anchor="start">D12 MISO</text><line class="wire" x1="870" y1="250" x2="848" y2="250" stroke="#2563eb"/><circle cx="848" cy="250" r="3.4" fill="#2563eb"/><text x="841" y="254" class="net" text-anchor="end" fill="#2563eb">MISO</text><circle cx="870" cy="272" r="3" fill="#64